<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NØVAK - Contacto</title>
    
    <!-- Script de precarga para evitar parpadeos de tema/idioma -->
    <script>
        (function() {
            var t = localStorage.getItem('theme') || 'dark';
            var l = localStorage.getItem('lang') || 'es';
            document.documentElement.setAttribute('data-bs-theme', t);
            document.documentElement.setAttribute('lang', l);
        })();
    </script>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- SDK Oficial de EmailJS para envío a Gmail -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          // Reemplaza "TU_PUBLIC_KEY" con tu clave pública real de EmailJS
          emailjs.init("TU_PUBLIC_KEY");
       })();
    </script>

    <!-- Estilos personalizados -->
    <style>
        :root {
            --brand-red: #ff3b30;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .brand-logo {
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .brand-logo span {
            color: var(--brand-red);
        }
        .btn-toggle-ui {
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 20px;
            padding: 5px 15px;
        }
    </style>
</head>
<body>

    <!-- Encabezado de Navegación -->
    <header class="p-3 border-bottom border-danger sticky-top bg-body">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h1 class="h3 m-0 brand-logo">NØV<span>AK</span></h1>
            <nav class="d-flex flex-wrap gap-1">
                <a href="index.html" class="btn btn-sm btn-outline-secondary" data-es="Inicio" data-en="Home">Inicio</a>
                <a href="javascript.html" class="btn btn-sm btn-outline-secondary">JavaScript</a>
                <a href="jquery.html" class="btn btn-sm btn-outline-secondary">jQuery</a>
                <a href="json.html" class="btn btn-sm btn-outline-secondary">JSON</a>
                <a href="hosting.html" class="btn btn-sm btn-outline-secondary" data-es="Hosting" data-en="Hosting">Hosting</a>
                <a href="herramientas.html" class="btn btn-sm btn-outline-secondary" data-es="Herramientas Google" data-en="Google Tools">Google Tools</a>
                <a href="cuestionario.html" class="btn btn-sm btn-outline-secondary" data-es="Cuestionario" data-en="Quiz">Cuestionario</a>
                <a href="contacto.html" class="btn btn-sm btn-danger" data-es="Contacto" data-en="Contact">Contacto</a>
            </nav>
            <div class="d-flex gap-2 align-items-center">
                <button id="btn-lang" class="btn btn-outline-danger btn-toggle-ui"><span id="lang-text">English</span></button>
                <button id="btn-theme" class="btn btn-outline-light btn-toggle-ui"><span id="theme-icon"></span><span id="theme-text">Modo Claro</span></button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal: Sección Contacto -->
    <main class="container my-5" style="max-width: 600px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-danger" data-es="Contáctanos" data-en="Contact Us">Contáctanos</h2>
            <p class="text-secondary" data-es="Envíanos tus dudas, sugerencias o consultas sobre la marca." data-en="Send us your questions, suggestions, or brand inquiries.">Envíanos tus dudas, sugerencias o consultas sobre la marca.</p>
        </div>

        <div class="card bg-body-tertiary border-secondary shadow-lg p-4 rounded-4">
            <!-- Formulario de Contacto -->
            <form id="form-contacto">
                <div class="mb-3">
                    <label for="nombre" class="form-label fw-bold" data-es="Nombre" data-en="Name">Nombre</label>
                    <input type="text" class="form-control bg-body border-secondary" id="nombre" required 
                           data-es-placeholder="Tu nombre completo" data-en-placeholder="Your full name" placeholder="Tu nombre completo">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold" data-es="Correo Electrónico" data-en="Email Address">Correo Electrónico</label>
                    <input type="email" class="form-control bg-body border-secondary" id="email" required 
                           data-es-placeholder="tucorreo@ejemplo.com" data-en-placeholder="yourname@example.com" placeholder="tucorreo@ejemplo.com">
                </div>
                <div class="mb-3">
                    <label for="mensaje" class="form-label fw-bold" data-es="Mensaje" data-en="Message">Mensaje</label>
                    <textarea class="form-control bg-body border-secondary" id="mensaje" rows="4" required 
                              data-es-placeholder="Escribe tu mensaje aquí..." data-en-placeholder="Write your message here..." placeholder="Escribe tu mensaje aquí..."></textarea>
                </div>
                <button type="submit" class="btn btn-danger w-100 fw-bold py-2" data-es="Enviar Mensaje" data-en="Send Message">Enviar Mensaje</button>
            </form>

            <!-- Alerta de éxito oculta por defecto -->
            <div id="alerta-contacto" class="alert alert-success mt-3 d-none text-center fw-bold" role="alert" 
                 data-es="¡Mensaje enviado con éxito a Discord y Gmail!" data-en="Message successfully sent to Discord and Gmail!">
                ¡Mensaje enviado con éxito a Discord y Gmail!
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
    
    <!-- Script principal con la lógica unificada -->
    <script src="script.js"></script>
</body>
</html>
